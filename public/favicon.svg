<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="glowLine" x1="44" y1="92" x2="84" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2"/>

  <!-- Git Main Branch Line -->
  <line x1="44" y1="28" x2="44" y2="100" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>

  <!-- Git Feature Branch Curve -->
  <path d="M44 80 C 44 56, 84 64, 84 40" stroke="url(#glowLine)" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Pulse Rings -->
  <circle cx="44" cy="92" r="16" fill="rgba(56, 189, 248, 0.15)"/>
  <circle cx="44" cy="36" r="14" fill="rgba(56, 189, 248, 0.15)"/>
  <circle cx="84" cy="36" r="14" fill="rgba(52, 211, 153, 0.2)"/>

  <!-- Nodes (Commits) -->
  <circle cx="44" cy="92" r="10" fill="#070b14" stroke="#38bdf8" stroke-width="6"/>
  <circle cx="44" cy="36" r="9" fill="#070b14" stroke="#38bdf8" stroke-width="5"/>
  <circle cx="84" cy="36" r="9" fill="#070b14" stroke="#34d399" stroke-width="5"/>

  <!-- Node Centers -->
  <circle cx="44" cy="92" r="4" fill="#38bdf8"/>
  <circle cx="44" cy="36" r="3.5" fill="#38bdf8"/>
  <circle cx="84" cy="36" r="3.5" fill="#34d399"/>
</svg>
